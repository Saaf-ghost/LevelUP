# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/boostup}
spring.datasource.username=${DB_USERNAME:boostup}
spring.datasource.password=${DB_PASSWORD:boostup}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:boostup}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:boostup}

# BoostUP AI Queue & Pipeline
app.rabbitmq.exchange=boostup.ai.exchange
app.rabbitmq.queue=boostup.pdf.jobs
app.rabbitmq.routing-key=pdf.job.process
app.rabbitmq.dlx=boostup.ai.dlx
app.rabbitmq.dlq=boostup.pdf.jobs.dlq
app.rabbitmq.dlq-routing-key=pdf.job.dlq

# File Upload Configuration
app.upload.dir=${UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

app.jwt.secret=${JWT_SECRET:change-this-development-jwt-secret-at-least-32-chars}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.metrics.review-threshold-hours=${REVIEW_THRESHOLD_HOURS:48}

# Server Configuration
server.port=${PORT:8082}
