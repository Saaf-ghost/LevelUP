services:
  postgres:
    image: postgres:16-alpine
    container_name: boostup-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-boostup}
      POSTGRES_USER: ${DB_USERNAME:-boostup}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-boostup}
    ports:
      - "55432:5432"
    volumes:
      - boostup-postgres-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: boostup-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-boostup}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-boostup}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - boostup-rabbitmq-data:/var/lib/rabbitmq

volumes:
  boostup-postgres-data:
  boostup-rabbitmq-data:
