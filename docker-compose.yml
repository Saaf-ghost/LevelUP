services:
  postgres:
    image: postgres:16-alpine
    container_name: boostup-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-boostup}
      POSTGRES_USER: ${DB_USERNAME:-boostup}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-boostup}
    ports:
      - "55432:5432"
    volumes:
      - boostup-postgres-data:/var/lib/postgresql/data

volumes:
  boostup-postgres-data:
